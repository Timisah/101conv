map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache, must-revalidate";
}

# Preserve the public scheme when this container is behind another proxy.
# The Host header is canonicalized from the request seen by this Nginx; the
# application deliberately ignores client-supplied X-Forwarded-Host values.
# Operators must configure the outer proxy to overwrite Host and
# X-Forwarded-Proto, rather than append untrusted values.
map $http_x_forwarded_host $origin_host {
    default $host;
    "" $http_host;
}
map $http_x_forwarded_proto $origin_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 5656;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Match Core: 1 GiB file ceiling plus 1 MiB multipart envelope.
    # Core still enforces each account/guest's lower file and storage quotas.
    client_max_body_size 1025m;

    location /api/ {
        proxy_pass http://core:5656;
        proxy_http_version 1.1;
        proxy_set_header Host $origin_host;
        proxy_set_header X-Forwarded-Host $origin_host;
        proxy_set_header X-Forwarded-Proto $origin_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-101conv-Proxy web;
        proxy_request_buffering off;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
    }
    location = /healthz { proxy_pass http://core:5656/healthz; proxy_set_header Host $origin_host; proxy_set_header X-101conv-Proxy web; }
    location = /readyz { proxy_pass http://core:5656/readyz; proxy_set_header Host $origin_host; proxy_set_header X-101conv-Proxy web; }
    location / { try_files $uri $uri/ /index.html; }
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
