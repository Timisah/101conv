map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache, must-revalidate";
}

# Preserve the public origin when this container is behind another proxy.
# Direct requests fall back to the host and scheme seen by this Nginx.
map $http_x_forwarded_host $origin_host {
    default $http_x_forwarded_host;
    "" $http_host;
}
map $http_x_forwarded_proto $origin_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 5656;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 105m;

    location /api/ {
        proxy_pass http://core:5656;
        proxy_http_version 1.1;
        proxy_set_header Host $origin_host;
        proxy_set_header X-Forwarded-Host $origin_host;
        proxy_set_header X-Forwarded-Proto $origin_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
    }
    location = /healthz { proxy_pass http://core:5656/healthz; proxy_set_header Host $origin_host; }
    location = /readyz { proxy_pass http://core:5656/readyz; proxy_set_header Host $origin_host; }
    location / { try_files $uri $uri/ /index.html; }
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
