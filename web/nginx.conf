server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 105m;

    location /api/ {
        proxy_pass http://core:5656;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
    }
    location = /healthz { proxy_pass http://core:5656/healthz; proxy_set_header Host $http_host; }
    location = /readyz { proxy_pass http://core:5656/readyz; proxy_set_header Host $http_host; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
