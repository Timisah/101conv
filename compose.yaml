name: 101conv-go

# no-new-privileges is intentionally omitted: on this Ubuntu host's
# snap-packaged Docker it prevents even container entrypoints from executing.
# Keep the remaining isolation controls (non-root app users, dropped
# capabilities, read-only filesystems, internal worker network, and limits).

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-101conv}
      POSTGRES_USER: ${POSTGRES_USER:-101conv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in Portainer}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER:-101conv_worker}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./db/init/01-worker-role.sh
        target: /docker-entrypoint-initdb.d/01-worker-role.sh
        read_only: true
    networks:
      - core-db
      - worker-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  core:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
      no_cache: true
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      PORT: 5656
      DATA_PATH: /var/lib/101conv
      UPLOADS_PATH: /var/lib/101conv/uploads
      RESULTS_PATH: /var/lib/101conv/results
      AUTOMATION_MOUNT_ROOTS: /mounts
      DATABASE_URL: "host=postgres port=5432 user=${POSTGRES_USER:-101conv} password=${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in Portainer} dbname=${POSTGRES_DB:-101conv} sslmode=disable"
      ENGINE_ADMIN_TOKEN: ${ENGINE_ADMIN_TOKEN:?Set a strong ENGINE_ADMIN_TOKEN in Portainer}
    volumes:
      - type: bind
        source: ${GO_DATA_PATH:-${DATA_PATH:?Set DATA_PATH to the parent of the persistent Go data directory}/go-data}
        target: /var/lib/101conv
        bind:
          create_host_path: false
      - uploads:/var/lib/101conv/uploads
      - results:/var/lib/101conv/results
      - type: bind
        source: ${AUTOMATION_HOST_PATH:-${DATA_PATH:?Set DATA_PATH to the parent of the persistent Go data directory}/automation-mounts}
        target: /mounts
        bind:
          create_host_path: true
    networks:
      - default
      - core-db
      - web-core
    depends_on:
      postgres:
        condition: service_healthy
    user: "65532:65532"
    healthcheck:
      test: ["CMD", "/101conv", "readycheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      no_cache: true
    ports:
      - "${PORT:-5656}:5656"
    networks:
      - web-core
    user: "101:101"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q --spider http://127.0.0.1:5656/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=0755
      - /var/run:rw,nosuid,nodev,noexec,size=2m,uid=101,gid=101,mode=0755
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
      no_cache: true
    command: ["worker"]
    user: "65532:65532"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=${POSTGRES_WORKER_USER:-${POSTGRES_USER:-101conv}} password=${POSTGRES_WORKER_PASSWORD:-${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in Portainer}} dbname=${POSTGRES_DB:-101conv} sslmode=disable"
      ENGINE_ROOT: /var/lib/101conv/engines
      UPLOADS_PATH: /var/lib/101conv/uploads
      RESULTS_PATH: /var/lib/101conv/results
      WORK_PATH: /work
      CONVERSION_TIMEOUT: ${CONVERSION_TIMEOUT:-10m}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-209715200}
      JOB_LEASE: ${JOB_LEASE:-45s}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_BATCH_CONCURRENCY: ${WORKER_BATCH_CONCURRENCY:-2}
    volumes:
      - type: bind
        source: ${GO_DATA_PATH:-${DATA_PATH:?Set DATA_PATH to the parent of the persistent Go data directory}/go-data}/engines
        target: /var/lib/101conv/engines
        read_only: true
        bind:
          create_host_path: false
      - uploads:/var/lib/101conv/uploads:ro
      - results:/var/lib/101conv/results
    networks:
      - worker-db
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/101conv", "worker-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
      - /work:rw,nosuid,nodev,noexec,size=1g,mode=0700,uid=65532,gid=65532
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
  results:

networks:
  core-db:
    internal: true
  worker-db:
    internal: true
  web-core:
    # This is the web ingress bridge; it must allow Docker's published host
    # port binding. The database and worker networks remain internal.
