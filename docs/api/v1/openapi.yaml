openapi: 3.1.0
info:
  title: 101Conv API
  version: 1.0.0
  description: Authenticated, asynchronous conversion jobs.
servers:
  - url: /
paths:
  /api/v1/profiles:
    get:
      summary: List profile catalogs and installed profiles
      description: Administrator session required.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Catalog sources and installed profile summaries }
        '403': { description: Administrator access required }
  /api/v1/profiles/catalogs:
    post:
      summary: Add a community profile catalog
      description: The built-in 101conv catalog is always present and cannot be removed.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: Public HTTPS catalog URL }
      responses:
        '200': { description: Updated catalog sources }
        '400': { description: URL is invalid or not public HTTPS }
        '403': { description: Administrator access required }
  /api/v1/profiles/catalogs/{sourceId}:
    parameters:
      - { in: path, name: sourceId, required: true, schema: { type: string } }
    get:
      summary: List profiles supported by the running 101conv version
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Compatible profiles and count filtered out by app-version bounds
          content:
            application/json:
              schema:
                type: object
                required: [profiles, incompatibleProfiles, applicationVersion]
                properties:
                  profiles: { type: array, items: { type: object } }
                  incompatibleProfiles: { type: integer }
                  applicationVersion: { type: string }
        '400': { description: Catalog could not be read or does not support this app version }
        '403': { description: Administrator access required }
  /api/v1/profiles/catalogs/{sourceId}/{profileId}/{version}:
    parameters:
      - { in: path, name: sourceId, required: true, schema: { type: string } }
      - { in: path, name: profileId, required: true, schema: { type: string } }
      - { in: path, name: version, required: true, schema: { type: string } }
    get:
      summary: Fetch a compatible profile manifest for review
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Profile metadata, compatibility range, package checksum, and converter rules }
        '400': { description: Profile is incompatible or its manifest is invalid }
        '403': { description: Administrator access required }
  /api/v1/profiles/catalogs/{sourceId}/{profileId}/{version}/install:
    parameters:
      - { in: path, name: sourceId, required: true, schema: { type: string } }
      - { in: path, name: profileId, required: true, schema: { type: string } }
      - { in: path, name: version, required: true, schema: { type: string } }
    post:
      summary: Verify and install a reviewed profile package
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Installed profile summary }
        '400': { description: Package, checksum, or compatibility validation failed }
        '403': { description: Administrator access required }
  /api/v1/jobs:
    post:
      summary: Submit a conversion job
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sourceFormat, targetFormat]
              properties:
                file: { type: string, format: binary }
                sourceFormat: { type: string }
                targetFormat: { type: string }
                converterId: { type: string }
                option_quality: { type: string, description: 'Option fields use the option_<key> prefix.' }
      responses:
        '202':
          description: Job accepted (or the existing result of an identical idempotent request).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '409': { description: Idempotency key conflicts with a different request }
        '413': { description: Upload exceeds the configured request limit }
        '422': { description: Conversion is unsupported }
  /api/v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Get job status
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { description: Authentication required }
        '404': { description: Job not found }
  /api/v1/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      summary: Request job cancellation
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Updated job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { description: Authentication required }
        '404': { description: Job not found }
  /api/v1/jobs/{id}/result:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Download a completed result
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Converted output file
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { description: Authentication required }
        '404': { description: Job or result not found }
        '409': { description: Job has not succeeded }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: conv_sid
  parameters:
    JobId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Job:
      type: object
      required: [id, state, sourceName, sourceFormat, targetFormat, converterId, attempt, createdAt]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED] }
        sourceName: { type: string }
        sourceFormat: { type: string }
        targetFormat: { type: string }
        converterId: { type: string }
        attempt: { type: integer, minimum: 0 }
        progress: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        cancellationRequested: { type: boolean }
        resultUrl: { type: [string, 'null'], format: uri-reference }
