openapi: 3.1.0
info:
  title: 101Conv API
  version: 1.0.0
  description: Authenticated 101conv management and conversion API. Regular users authenticate with account sessions or scoped API keys.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Process liveness probe
      responses:
        '200': { description: Core process is serving HTTP }
  /readyz:
    get:
      summary: Core service readiness probe
      description: Returns 200 when PostgreSQL schema access and Core-managed storage are available. This does not require a Worker or installed converter; readyToConvert is a separate operational signal exposed by the authenticated operations endpoint.
      responses:
        '200': { description: Core can serve setup and API requests }
        '503': { description: PostgreSQL, schema, or Core storage is unavailable }
  /api/v1/setup/status:
    get:
      summary: Check whether first-run setup is claimed and complete
      responses:
        '200': { description: Setup state; no credentials or storage secrets returned }
        '503': { description: PostgreSQL setup state is unavailable }
  /api/v1/setup/claim:
    post:
      summary: Atomically create the first administrator account
      description: Available only before the instance is claimed. Requires same-origin request and the administrator bootstrap passphrase (ENGINE_ADMIN_TOKEN, at least 24 characters). Rate limited. No fixed default password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bootstrapToken, username, password]
              properties:
                bootstrapToken: { type: string, writeOnly: true }
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 5, maxLength: 256, writeOnly: true, description: "Five characters remain accepted for compatibility but are weak; use a long passphrase." }
      responses:
        '201': { description: Administrator created and HttpOnly session set }
        '401': { description: Bootstrap secret rejected }
        '409': { description: Another administrator already claimed setup }
        '422': { description: Username or password invalid }
  /api/v1/setup/readiness:
    get:
      summary: Check container-visible storage and installed converters during setup
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: Writable mount checks, installed engine/profile counts and Worker workspace limit }
  /api/v1/setup/complete:
    post:
      summary: Mark first-run setup complete after storage checks
      security: [{ adminSession: [] }]
      responses:
        '204': { description: Setup completed }
        '403': { description: Initial account session required }
        '503': { description: Application storage not writable }
  /api/v1/storage:
    get:
      summary: Get storage measurements, retention setting and cleanup history
      description: Includes PostgreSQL database size, recorded upload/result totals, active input-size estimate, latest asynchronous read-only filesystem inventory with modified-age buckets and discrepancy samples, mount capacity, and retention. PostgreSQL filesystem free capacity and live Worker scratch usage are not exposed to Core.
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: Storage overview and retention state }
  /api/v1/storage/scan:
    post:
      summary: Start or resume an asynchronous read-only filesystem inventory
      description: Scans configured uploads, results, and managed engines in bounded batches. It reports missing and unreferenced file counts and never deletes files.
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '202': { description: Scan status and progress }
  /api/v1/storage/cleanup/preview:
    get:
      summary: Preview a retention category before saving or applying cleanup
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { name: category, in: query, required: false, schema: { type: string, enum: [unsubmitted, submitted_originals, successful_originals, successful_results, failed_originals, canceled_originals], default: unsubmitted } }
        - { name: days, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 3650 } }
      responses:
        '200': { description: Estimated candidates and bytes plus short-lived preview token }
  /api/v1/storage/retention:
    put:
      summary: Set independent file-retention policies
      description: Supports unsubmitted uploads, submitted originals, successful results, failed originals, and canceled originals. Time-based and after-success deletion settings require a matching recent preview. Defaults are keep indefinitely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unsubmittedUploads: { $ref: '#/components/schemas/RetentionRule' }
                submittedOriginals: { $ref: '#/components/schemas/RetentionRule' }
                successfulResults: { $ref: '#/components/schemas/RetentionRule' }
                failedOriginals: { $ref: '#/components/schemas/RetentionRule' }
                canceledOriginals: { $ref: '#/components/schemas/RetentionRule' }
                previewToken: { type: string }
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: Saved policy }
        '409': { description: Preview is stale or missing }
  /api/v1/storage/cleanup:
    post:
      summary: Delete up to 100 eligible files from a previewed category
      description: Requires a fresh category preview token. Durable claim flags and tombstone markers support crash recovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, days, previewToken]
              properties:
                category: { type: string, enum: [unsubmitted, submitted_originals, successful_originals, successful_results, failed_originals, canceled_originals] }
                days: { type: integer, minimum: 0, maximum: 3650 }
                previewToken: { type: string }
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: Actual deletion count and reclaimed bytes }
        '409': { description: Preview is stale or missing }
        '500': { description: Cleanup interrupted; pending claims can be retried }
  /api/v1/operations:
    get:
      summary: Inspect Core conversion readiness and operational issues
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: Worker heartbeat, database, storage, engine/profile and repository status, jobs and leases }
  /api/v1/settings/session:
    get:
      summary: Read the instance-wide browser session lifetime
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: Current timeout in minutes }
        '401': { description: Administrator authentication required }
    put:
      summary: Set the instance-wide browser session lifetime
      description: Applies to newly created sessions. Existing sessions retain the expiry assigned at sign-in. Allowed range is 5 minutes to 30 days.
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionTimeoutMinutes]
              properties:
                sessionTimeoutMinutes: { type: integer, minimum: 5, maximum: 43200 }
      responses:
        '200': { description: Timeout saved persistently }
        '401': { description: Administrator authentication required }
        '422': { description: Timeout outside the allowed range }
  /api/v1/settings/anonymous:
    get:
      summary: Read administrator-controlled anonymous conversion settings
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: Guest capabilities, rate limits, capacity, and expiry settings }
        '403': { description: Administrator authorization required }
    put:
      summary: Update anonymous conversion settings
      description: New instances enable guest mode after first-run setup; migrated installations remain private until explicitly enabled. Guest writes require same-origin cookies and all limits are enforced server-side. Total guest storage includes retained originals and results plus the maximum-output reservation for queued/running jobs.
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, allowConversion, allowCompression, maxFileBytes, maxBatchFiles, maxSimultaneousJobs, uploadsPerMinute, submissionsPerMinute, globalUploadsPerMinute, globalSubmissionsPerMinute, maxGlobalJobs, maxGlobalStorageBytes, resultExpirationHours, sessionExpirationHours, uploadExpirationHours, failedExpirationHours, metadataExpirationHours]
              properties:
                enabled: { type: boolean }
                allowConversion: { type: boolean }
                allowCompression: { type: boolean }
                maxFileBytes: { type: integer, minimum: 1, maximum: 1073741824, description: Maximum input size per file, up to 1 GiB. }
                maxBatchFiles: { type: integer, minimum: 1, maximum: 20 }
                maxSimultaneousJobs: { type: integer, minimum: 1, maximum: 100 }
                uploadsPerMinute: { type: integer, minimum: 1, maximum: 120 }
                submissionsPerMinute: { type: integer, minimum: 1, maximum: 60 }
                globalUploadsPerMinute: { type: integer, minimum: 1, maximum: 10000 }
                globalSubmissionsPerMinute: { type: integer, minimum: 1, maximum: 10000 }
                maxGlobalJobs: { type: integer, minimum: 1, maximum: 1000 }
                maxGlobalStorageBytes: { type: integer, minimum: 10485760, maximum: 1099511627776, description: Total guest original/result bytes, active-job output reservations, and in-flight upload reservations. Must fit maxFileBytes plus one maximum output (200 MiB). }
                resultExpirationHours: { type: integer, minimum: 1, maximum: 720 }
                sessionExpirationHours: { type: integer, minimum: 1, maximum: 720 }
                uploadExpirationHours: { type: integer, minimum: 1, maximum: 720 }
                failedExpirationHours: { type: integer, minimum: 1, maximum: 720 }
                metadataExpirationHours: { type: integer, minimum: 1, maximum: 8760 }
      responses:
        '200': { description: Settings saved and audited }
        '403': { description: Administrator authorization required }
        '422': { description: One or more limits are outside supported bounds }
  /api/v1/auth/session:
    get:
      summary: Check this browser session and whether guest access is enabled
      responses:
        '200': { description: Authenticated account/guest state, or anonymous availability; no-store response }
    post:
      summary: Create an HttpOnly administrator or user session
      description: Send only password for the legacy administrator passphrase, or username and password for a local user account. The returned opaque cookie is server-side and HttpOnly, host-only, and SameSite Strict. Login attempts are rate limited; client-supplied forwarding headers do not select a new limiter bucket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string, writeOnly: true }
      responses:
        '201': { description: Session cookie set with HttpOnly and SameSite Strict attributes }
        '401': { description: Invalid username or password }
        '503': { description: Authentication or management storage is not configured }
    delete:
      summary: End the current session
      security: [{ adminSession: [] }]
      responses:
        '204': { description: Session revoked and cookie cleared }
        '401': { description: Session required }
  /api/v1/auth/guest-session:
    post:
      summary: Start a temporary, isolated anonymous conversion session
      description: "Available only after first-run administrator setup and when guest mode is enabled. A unique 256-bit credential is issued as an HttpOnly, SameSite Strict cookie; only its digest is persisted. Guest-session creation is public and rate limited. Subsequent guest uploads, submissions, cancellations, downloads, and logout require an exact same-origin request or the frontend's explicit non-simple `X-101conv-Request: guest-session` marker when a documented proxy strips browser origin metadata; JSON content type alone is not sufficient."
      responses:
        '201': { description: Guest session created; cookie and effective guest limits returned }
        '403': { description: Guest access is disabled or setup is incomplete }
        '429': { description: Instance guest-session rate limit reached }
    delete:
      summary: Revoke the current temporary guest session
      responses:
        '204': { description: Guest credential revoked and cookie cleared }
  /api/v1/me:
    get:
      summary: Read the current account and monthly usage
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      responses:
        '200': { description: Current identity, permissions, quotas, and (for users) current-month usage }
        '401': { description: Authentication required }
  /api/v1/me/password:
    post:
      summary: Change the signed-in user's password
      security: [{ adminSession: [] }]
      description: Requires an interactive user session, current password, and a new password of at least 5 characters. Five characters remain accepted for compatibility but are weak; administrators should use a long passphrase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, writeOnly: true }
                newPassword: { type: string, minLength: 5, maxLength: 256, writeOnly: true, description: "Five characters remain accepted for compatibility but are weak; use a long passphrase." }
      responses:
        '204': { description: Password changed }
        '401': { description: Current password is incorrect }
  /api/v1/me/api-keys:
    get:
      summary: List the current user's active API keys
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Key names, scopes, creation time, and last use; key material is never returned }
    post:
      summary: Create a scoped API key for the current user
      security: [{ adminSession: [] }]
      description: Requires an interactive user session. The raw token is returned once; store it in the external service's secret store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 80 }
                scopes:
                  type: array
                  uniqueItems: true
                  items: { type: string, enum: [conversion:upload, conversion:submit, jobs:read, jobs:cancel, results:download] }
      responses:
        '201': { description: New key, including its one-time raw token }
        '400': { description: Invalid scope or scope exceeds account permission }
  /api/v1/me/api-keys/{keyID}:
    delete:
      summary: Revoke one of the current user's API keys
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: keyID, required: true, schema: { type: string } }
      responses:
        '204': { description: Key revoked immediately }
        '404': { description: Key not found for this user }
  /api/v1/users:
    get:
      summary: List user accounts (administrator only)
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: User permissions and quota settings; password hashes and API key material are not returned }
    post:
      summary: Create a regular user account (users.manage permission required)
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, quotas]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 5, maxLength: 256, writeOnly: true, description: "Five characters remain accepted for compatibility but are weak; use a long passphrase." }
                roleId: { type: string, description: Reusable permission role id }
                quotas:
                  $ref: '#/components/schemas/QuotaSettings'
      responses:
        '201': { description: User created; initial password is not retained in plaintext }
        '409': { description: Username already exists }
  /api/v1/users/{id}:
    patch:
      summary: Change a user's permissions, role, groups, or quotas (users.manage permission required)
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                role: { type: string, enum: [user, admin] }
                roleId: { type: string }
                groupIds: { type: array, items: { type: string } }
                permissionOverrides: { type: object, additionalProperties: { oneOf: [{type: boolean},{type: 'null'}] }, description: Null removes a user override and inherits policy }
                quotas: { $ref: '#/components/schemas/QuotaSettings' }
                password: { type: string, minLength: 5, maxLength: 256, writeOnly: true, description: "Optional administrator password reset. Five characters remain accepted for compatibility but are weak; use a long passphrase." }
      responses:
        '200': { description: Updated user account }
        '404': { description: User not found }
    delete:
      summary: Disable a user and revoke their API keys (users.manage permission required)
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: Account disabled; jobs and audit data remain stored }
  /api/v1/users/bulk:
    post:
      summary: Apply selected account changes with per-user results (administrator only)
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
                enabled: { type: boolean }
                role: { type: string, enum: [user, admin] }
                roleId: { type: string }
                groupAction: { type: string, enum: [add, remove] }
                groupId: { type: string }
                groupIds: { type: array, items: { type: string } }
                permissionOverrides: { type: object, additionalProperties: { oneOf: [{type: boolean},{type: 'null'}] } }
                quotas: { $ref: '#/components/schemas/QuotaSettings' }
      responses:
        '200': { description: All selected accounts updated }
        '207': { description: Partial success with per-user errors }
  /api/v1/groups:
    get:
      summary: List groups and effective group quota policies
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses: { '200': { description: Group definitions and membership counts } }
    post:
      summary: Create a group
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { id: {type: string}, name: {type: string}, description: {type: string}, roleId: {type: string}, permissions: {type: object, additionalProperties: {type: boolean}}, quotas: {$ref: '#/components/schemas/QuotaSettings'}} }
      responses: { '200': { description: Group created } }
  /api/v1/groups/{id}:
    put:
      summary: Update group policy
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {name: {type: string}, description: {type: string}, roleId: {type: string}, permissions: {type: object, additionalProperties: {type: boolean}}, quotas: {$ref: '#/components/schemas/QuotaSettings'}}}}}}
      responses: { '200': { description: Group updated } }
    delete:
      summary: Delete a group without deleting its members or their job history
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: { '204': { description: Group and memberships removed } }
  /api/v1/groups/{id}/members:
    put:
      summary: Replace group membership
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [userIds], properties: {userIds: {type: array, maxItems: 1000, items: {type: string}}}}}}}
      responses: { '204': { description: Membership replaced transactionally } }
  /api/v1/roles:
    get:
      summary: List reusable roles and permission names
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses: { '200': { description: Roles and supported permissions } }
    post:
      summary: Create a reusable role
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [id, name, permissions], properties: {id: {type: string}, name: {type: string}, description: {type: string}, permissions: {type: object, additionalProperties: {type: boolean}}}}}}}
      responses: { '200': { description: Role created } }
  /api/v1/roles/{id}:
    put:
      summary: Update a reusable role
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {name: {type: string}, description: {type: string}, permissions: {type: object, additionalProperties: {type: boolean}}}}}}}
      responses: { '200': { description: Role updated; active identities reevaluate immediately } }
    delete:
      summary: Delete an unused custom role
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: { '204': { description: Role removed } }
  /api/v1/repositories:
    get:
      summary: List configured repository sources and trust state
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      responses:
        '200': { description: Sources including the bundled official source's approval state }
        '401': { description: Administrator bearer token required }
    post:
      summary: Add an explicitly approved local or community TUF repository
      description: The supplied root fingerprint must be independently verified by the administrator.
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, url, kind, trustedRoot, fingerprint, approved]
              properties:
                id: { type: string }
                name: { type: string }
                url: { type: string, format: uri }
                kind: { type: string, enum: [community, local] }
                trustedRoot: { type: string, contentEncoding: base64 }
                fingerprint: { type: string, description: SHA-256 of exact root bytes }
                approved: { type: boolean, const: true }
      responses:
        '201': { description: Repository pinned and approved }
        '400': { description: Invalid source, root, fingerprint, or approval }
        '401': { description: Administrator bearer token required }
  /api/v1/repositories/{id}:
    delete:
      summary: Remove a configured repository and its metadata cache
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: Repository removed }
        '401': { description: Administrator bearer token required }
        '404': { description: Repository not found }
  /api/v1/repositories/{id}/enabled:
    patch:
      summary: Enable or disable a configured community or local repository
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Updated source state; disablement invalidates outstanding plans }
        '401': { description: Administrator bearer token required }
        '409': { description: Bundled official source has no provisioned root }
  /api/v1/repositories/{id}/trust:
    patch:
      summary: Explicitly approve or revoke unsigned installs from the bundled GitHub catalog
      description: This development-stage opt-in does not authenticate publisher identity. HTTPS and the catalog-provided package digest are checked, but unsigned catalog metadata can be replaced by anyone able to alter the upstream GitHub source.
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, const: 101conv-official } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
      responses:
        '200': { description: Updated official catalog approval state; revocation invalidates outstanding plans }
        '400': { description: Verified official trust root already provisioned }
        '401': { description: Administrator bearer token or session required }
  /api/v1/repositories/{id}/refresh:
    post:
      summary: Refresh repository metadata and update status
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Repository status and refresh time; the built-in official catalog can refresh unsigned metadata }
        '502': { description: Signature, expiration, or rollback verification failed }
        '401': { description: Administrator bearer token required }
  /api/v1/repositories/{id}/catalog:
    get:
      summary: Browse repository metadata without downloading or executing package contents
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Engine and profile definitions; unsigned official metadata is returned as untrusted }
        '400': { description: Trust, signature, expiry, rollback, or compatibility validation failed }
        '401': { description: Administrator bearer token required }
  /api/v1/repositories/{id}/profiles/{profileID}/preview:
    get:
      summary: Preview publisher, trust state, license, dependencies, capabilities, and planned changes for an approved source
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: profileID, required: true, schema: { type: string } }
      responses:
        '200': { description: Installation preview; no package is installed }
        '400': { description: Invalid repository or unsatisfied dependency }
        '401': { description: Administrator bearer token required }
  /api/v1/repositories/{id}/profiles/{profileID}/install:
    post:
      summary: Install a trusted repository profile and missing engines
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: profileID, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, description: Short-lived immutable preview plan ID }
      responses:
        '201': { description: Installed profile and resolved dependencies }
        '400': { description: Verification, extraction, compatibility, or dependency failure }
        '401': { description: Administrator bearer token required }
  /api/v1/repositories/{id}/profiles/{profileID}:
    put:
      summary: Update an installed profile from its trusted repository
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: profileID, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, description: Short-lived immutable update preview plan ID }
      responses:
        '200': { description: Updated profile }
        '400': { description: Verification or dependency failure }
        '401': { description: Administrator bearer token required }
  /api/v1/repositories/{id}/engines/{engineID}/{version}/install:
    post:
      summary: Install a verified engine release; existing versions remain available for rollback
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: engineID, required: true, schema: { type: string } }
        - { in: path, name: version, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
      responses:
        '201': { description: Installed engine version }
        '400': { description: Verification or package installation failed }
        '401': { description: Administrator bearer token required }
  /api/v1/repositories/{id}/engines/{engineID}/{version}/preview:
    get:
      summary: Create a short-lived immutable engine installation preview
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: engineID, required: true, schema: { type: string } }
        - { in: path, name: version, required: true, schema: { type: string } }
      responses:
        '200': { description: Engine package digest, publisher, trust state, exact version and plan ID }
        '401': { description: Administrator bearer token required }
  /api/v1/repositories/{id}/profiles/{profileID}/update-preview:
    get:
      summary: Create a short-lived immutable profile update preview
      security: [{ engineAdmin: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: profileID, required: true, schema: { type: string } }
      responses:
        '200': { description: Dependency preview and exact repository snapshot digest }
        '401': { description: Administrator bearer token required }
  /api/v1/profiles:
    get:
      summary: List profile catalogs and installed profiles
      description: "Administrator, converting user, or API key with conversion:submit scope."
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      responses:
        '200': { description: Catalog sources and installed profile summaries }
        '403': { description: Administrator access required }
  /api/v1/capabilities:
    get:
      summary: List canonical capabilities and installed providers
      description: "Returns the additive Capability → Provider read model. Legacy profile APIs remain available for compatibility; executable paths and argument templates are never returned here."
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      responses:
        '200':
          description: Canonical capability/provider catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityCatalog'
        '401': { description: Authentication required }
        '403': { description: Conversion or compression permission required }
  /api/v1/capabilities/resolve:
    get:
      summary: Resolve one canonical capability to a provider
      description: "Uses an explicit providerId preference when available, otherwise a stable profile/version/engine order. The response includes candidate reasons for support diagnostics."
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters:
        - { in: query, name: operation, required: true, schema: { type: string, enum: [convert, compress] } }
        - { in: query, name: source, required: true, schema: { type: string } }
        - { in: query, name: target, required: true, schema: { type: string } }
        - { in: query, name: providerId, required: false, schema: { type: string }, description: Explicit provider preference; unavailable preferences fall back deterministically }
      responses:
        '200': { description: Resolved provider and explainable candidates }
        '401': { description: Authentication required }
        '403': { description: Conversion or compression permission required }
        '422': { description: No available provider satisfies the requested mapping }
  /api/v1/presets:
    get:
      summary: List personal and shared conversion presets
      description: Guests can read shared presets; authenticated users see their own presets plus shared presets. Compatibility is evaluated against the currently installed capability catalog.
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters:
        - { in: query, name: mode, required: false, schema: { type: string, enum: [convert, compress] } }
      responses:
        '200':
          description: Presets visible to the caller, including compatibility status
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets: { type: array, items: { $ref: '#/components/schemas/Preset' } }
        '401': { description: Authentication required }
    post:
      summary: Create a personal or administrator-shared preset
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetWrite' }
      responses:
        '201': { description: Preset created and checked against the installed provider schema, content: { application/json: { schema: { $ref: '#/components/schemas/Preset' } } } }
        '400': { description: Invalid preset name, mode, format or option shape }
        '403': { description: Shared presets require administrator access }
        '422': { description: No compatible provider or typed option schema }
  /api/v1/presets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Edit an owned preset
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetWrite' }
      responses:
        '200': { description: Updated preset }
        '403': { description: Preset is not owned by the caller }
        '404': { description: Preset not found }
        '422': { description: Updated settings are incompatible }
    delete:
      summary: Delete an owned preset
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      responses:
        '204': { description: Preset deleted }
        '403': { description: Preset is not owned by the caller }
        '404': { description: Preset not found }
  /api/v1/presets/{id}/duplicate:
    post:
      summary: Duplicate a visible preset into the caller's personal presets
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '201': { description: Personal duplicate created }
        '403': { description: Guest or unauthorized duplicate request }
        '404': { description: Preset not found }
        '422': { description: Source preset is no longer compatible }
  /api/v1/presets/{id}/default:
    patch:
      summary: Set or clear a default for a source/target operation mapping
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Updated default state }
        '403': { description: Preset is not owned by the caller }
        '404': { description: Preset not found }
        '422': { description: Incompatible presets cannot become defaults }
  /api/v1/profiles/catalogs:
    post:
      summary: Add a community profile catalog
      description: The built-in 101conv catalog is always present and cannot be removed.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: Public HTTPS catalog URL }
      responses:
        '200': { description: Updated catalog sources }
        '400': { description: URL is invalid or not public HTTPS }
        '403': { description: Administrator access required }
  /api/v1/profiles/catalogs/{sourceId}:
    parameters:
      - { in: path, name: sourceId, required: true, schema: { type: string } }
    get:
      summary: List profiles supported by the running 101conv version
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Compatible profiles and count filtered out by app-version bounds
          content:
            application/json:
              schema:
                type: object
                required: [profiles, incompatibleProfiles, applicationVersion]
                properties:
                  profiles: { type: array, items: { type: object } }
                  incompatibleProfiles: { type: integer }
                  applicationVersion: { type: string }
        '400': { description: Catalog could not be read or does not support this app version }
        '403': { description: Administrator access required }
  /api/v1/profiles/catalogs/{sourceId}/{profileId}/{version}:
    parameters:
      - { in: path, name: sourceId, required: true, schema: { type: string } }
      - { in: path, name: profileId, required: true, schema: { type: string } }
      - { in: path, name: version, required: true, schema: { type: string } }
    get:
      summary: Fetch a compatible profile manifest for review
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Profile metadata, compatibility range, package checksum, and converter rules }
        '400': { description: Profile is incompatible or its manifest is invalid }
        '403': { description: Administrator access required }
  /api/v1/profiles/catalogs/{sourceId}/{profileId}/{version}/install:
    parameters:
      - { in: path, name: sourceId, required: true, schema: { type: string } }
      - { in: path, name: profileId, required: true, schema: { type: string } }
      - { in: path, name: version, required: true, schema: { type: string } }
    post:
      summary: Verify and install a reviewed profile package
      security: [{ adminSession: [] }]
      responses:
        '201': { description: Installed profile summary }
        '400': { description: Package, checksum, or compatibility validation failed }
        '403': { description: Administrator access required }
  /api/v1/uploads:
    post:
      summary: Upload one input file for asynchronous conversion
      description: The returned uploadId can be submitted once to create a job. Maximum input size is 1 GiB, subject to the per-account or guest quota.
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Input stored and fingerprinted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '400': { description: Invalid or empty upload }
        '401': { description: Authentication required }
        '413': { description: Input exceeds the per-account, guest, or 1 GiB instance limit }
        '429': { description: Monthly uploaded input-data quota exceeded }
  /api/v1/jobs:
    get:
      summary: List durable jobs with optional status and text filters
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [queued, running, succeeded, failed, cancelled] } }
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200': { description: Newest matching jobs and total count }
        '400': { description: Invalid status or query parameters }
        '401': { description: Administrator session required }
    post:
      summary: Submit an uploaded file for conversion by an installed profile
      description: Clients may select a profile explicitly. When profileId is omitted, the Core resolves personal preferences, administrator defaults, then a deterministic compatible fallback.
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, targetFormat, idempotencyKey]
              properties:
                uploadId: { type: string, format: uuid }
                profileId: { type: string }
                targetFormat: { type: string, pattern: '^[a-z0-9]{1,12}$' }
                idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSubmission' }
        '200': { description: Existing job returned for an identical idempotent request }
        '400': { description: Invalid request }
        '401': { description: Administrator bearer token required }
        '404': { description: Upload or profile not found }
        '409': { description: Idempotency key conflicts or upload is already consumed }
        '422': { description: Conversion is unsupported }
  /api/v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Get job status
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      responses:
        '200':
          description: Current job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        '401': { description: Administrator bearer token required }
        '404': { description: Job not found }
  /api/v1/compressions:
    post:
      summary: Submit a compression job using a profile-declared compression mode
      description: The selected installed profile validates every option and resolves the converter argv. The target format may match the source format to preserve it, or use another format supported by the profile. Results are rejected if they exceed a declared target size.
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, targetFormat, idempotencyKey]
              properties:
                uploadId: { type: string, format: uuid }
                profileId: { type: string }
                targetFormat: { type: string, pattern: '^[a-z0-9]{1,12}$' }
                idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
                options: { type: object, additionalProperties: { type: string }, description: Typed profile options such as image width, height, quality, compression level, and metadata policy. Unknown keys and out-of-range values are rejected. }
      responses:
        '202': { description: Compression job accepted; response uses JobSubmission }
        '400': { description: Invalid or out-of-range profile option }
        '401': { description: Authentication required }
        '404': { description: Upload or profile not found }
        '409': { description: Idempotency key conflicts or upload is already consumed }
        '422': { description: Profile does not support compression for this source and target pair }
  /api/v1/batches:
    post:
      summary: Create one durable conversion or compression batch
      description: Items resolve profiles independently by explicit selection, personal preference, administrator default, then compatible fallback. Per-item incompatibility or quota failures are recorded while other items can proceed. Requests are idempotent by owner and key.
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
      responses:
        '202': { description: Batch created with individual item states }
        '200': { description: Existing batch returned for the same idempotent request }
        '403': { description: Missing mode permission or API-key scope }
        '409': { description: Idempotency key conflict }
    get:
      summary: List batches visible to the caller
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0 } }
      responses: { '200': { description: Paginated batch states and items } }
  /api/v1/batches/{id}:
    get:
      summary: Read a batch and its current jobs
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Batch summary and per-item states }
        '404': { description: Batch is absent or not visible to the caller }
  /api/v1/batches/{id}/resume:
    post:
      summary: Resume items persisted before an interrupted submission
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '202': { description: Pending batch items resumed idempotently } }
  /api/v1/batches/{id}/cancel:
    post:
      summary: Cancel all queued batch jobs and request cancellation for running jobs
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '202': { description: Updated batch state } }
  /api/v1/batches/{id}/items/{index}/cancel:
    post:
      summary: Cancel one batch item
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: index, required: true, schema: { type: integer, minimum: 0, maximum: 99 } }
      responses: { '202': { description: Other batch items are unaffected } }
  /api/v1/batches/{id}/retry:
    post:
      summary: Retry all failed items, or a requested subset of failed item indexes
      description: Retries create new jobs while preserving the original immutable engine/profile execution specification. Successful items are not resubmitted. Retries require available originals, enabled profiles, installed pinned engine versions, current authorization, and quota capacity.
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                items: { type: array, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 99 } }
      responses:
        '202': { description: New retry jobs created for failed items }
        '410': { description: Original is expired or missing }
  /api/v1/batches/{id}/results.zip:
    get:
      summary: Stream successful available results as a ZIP archive
      description: Includes only owned, successful, available results. Generated filenames prevent traversal and collisions. Archive generation is streamed and limited to 512 MiB.
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: ZIP stream, content: { application/zip: {} } }
        '409': { description: No available successful results }
        '413': { description: Results exceed archive limit; download files individually }
  /api/v1/profile-preferences:
    get:
      summary: List this account's effective profile mappings
      description: Returns exact source and target format mappings with personal preference, administrator default, compatible alternatives, and the effective resolution source. A stale saved preference is retained but excluded from execution.
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      parameters:
        - { in: query, name: mode, schema: { type: string, enum: [convert, compress] } }
      responses:
        '200': { description: Effective mappings and currently enabled compatible alternatives }
        '401': { description: Authentication required }
        '403': { description: Conversion or compression capability required }
  /api/v1/profile-preferences/me/{mode}/{source}/{target}:
    parameters:
      - { in: path, name: mode, required: true, schema: { type: string, enum: [convert, compress] } }
      - { in: path, name: source, required: true, schema: { type: string, pattern: '^[a-z0-9]{1,12}$' } }
      - { in: path, name: target, required: true, schema: { type: string, pattern: '^[a-z0-9]{1,12}$' } }
    put:
      summary: Set a personal preferred profile for an exact mapping
      security: [{ userAPIKey: [] }, { adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string }
      responses:
        '200': { description: Preference saved }
        '403': { description: Mode permission is missing }
        '422': { description: Profile is disabled, incompatible, or unauthorized }
    delete:
      summary: Reset this mapping to inherit the administrator default
      security: [{ userAPIKey: [] }, { adminSession: [] }]
      responses:
        '204': { description: Personal override removed; other mappings are unchanged }
        '403': { description: Mode permission is missing }
  /api/v1/profile-preferences/global:
    get:
      summary: List administrator defaults and compatible alternatives
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: mode, schema: { type: string, enum: [convert, compress] } }
      responses:
        '200': { description: Searchable exact-format mapping data for administration }
        '401': { description: Administrator session required }
  /api/v1/profile-preferences/global/{mode}/{source}/{target}:
    parameters:
      - { in: path, name: mode, required: true, schema: { type: string, enum: [convert, compress] } }
      - { in: path, name: source, required: true, schema: { type: string, pattern: '^[a-z0-9]{1,12}$' } }
      - { in: path, name: target, required: true, schema: { type: string, pattern: '^[a-z0-9]{1,12}$' } }
    put:
      summary: Set the administrator's default profile for a mapping
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string }
      responses:
        '200': { description: Default saved and audited }
        '422': { description: Profile is disabled, incompatible, or unavailable }
    delete:
      summary: Clear an administrator default and use deterministic automatic fallback
      security: [{ adminSession: [] }]
      responses:
        '204': { description: Default cleared and audited }
  /api/v1/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      summary: Request job cancellation
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      responses:
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { description: Administrator bearer token required }
        '404': { description: Job not found }
  /api/v1/jobs/{id}/result:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Download a completed result
      security: [{ engineAdmin: [] }, { userAPIKey: [] }, { adminSession: [] }]
      responses:
        '200':
          description: Converted output file
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { description: Administrator bearer token required }
        '404': { description: Job or result not found }
        '409': { description: Job has not succeeded }
  /api/v1/drives:
    get:
      summary: List registered mounted locations and health
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Drive registrations, access, capacity and automation references
          content:
            application/json:
              schema:
                type: object
                properties:
                  drives: { type: array, items: { $ref: '#/components/schemas/MountedDrive' } }
    post:
      summary: Register an existing container-mounted directory
      description: Paths must be within AUTOMATION_MOUNT_ROOTS. This endpoint cannot create host mounts or access Docker.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, path, access]
              properties:
                name: { type: string, maxLength: 100 }
                path: { type: string, format: path }
                access: { type: string, enum: [read, read_write] }
      responses:
        '201': { description: Drive registered }
        '422': { description: Path is unavailable, unsafe, or outside configured mount roots }
  /api/v1/drives/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    put:
      summary: Update a drive label, path, access or enabled state
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Updated drive }
        '422': { description: Invalid path or access mode }
    delete:
      summary: Remove an unused drive registration
      security: [{ adminSession: [] }]
      responses:
        '204': { description: Registration removed }
        '409': { description: A current automation revision references this drive }
  /api/v1/drives/test:
    post:
      summary: Test container path access
      description: Optional write test creates and removes a temporary probe file under the approved mount root.
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Access check passed }
        '422': { description: Path is not accessible or writable }
  /api/v1/automation-blocks:
    get:
      summary: List the versioned built-in declarative blocks
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Block IDs, versions, configuration descriptions and permissions }
  /api/v1/blueprints:
    get:
      summary: List built-in automation blueprints
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Automatic Folder Conversion and Automatic Compression }
  /api/v1/blueprints/{id}/install:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, enum: [automatic-folder-conversion, automatic-compression] } }
    post:
      summary: Install an editable automation from a built-in blueprint
      description: Creates a new independent revision; it never overwrites an existing automation.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlueprintInstall' }
      responses:
        '201':
          description: Automation created from the specified blueprint version
          content:
            application/json:
              schema:
                type: object
                properties:
                  automation: { $ref: '#/components/schemas/Automation' }
                  blueprintId: { type: string }
                  blueprintVersion: { type: string }
        '422': { description: Missing drive or compatible installed profile }
  /api/v1/automations:
    get:
      summary: List automations owned by the caller
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Current revision, enabled state and diagnostics }
    post:
      summary: Create a declarative automation
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomationWrite' }
      responses:
        '201': { description: Automation and initial revision created }
  /api/v1/automations/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Read an automation's current revision
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Automation definition and revision number }
        '404': { description: Not found or not owned by caller }
    put:
      summary: Save a new immutable automation revision
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomationWrite' }
      responses:
        '200': { description: New revision activated for future executions }
        '422': { description: Invalid or incompatible definition }
    delete:
      summary: Delete an automation with no active execution
      security: [{ adminSession: [] }]
      responses:
        '204': { description: Automation and its history deleted }
        '409': { description: An execution is active }
  /api/v1/automations/{id}/enabled:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      summary: Enable or pause an automation
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: New enabled state }
        '422': { description: A drive or profile dependency is unavailable }
  /api/v1/automations/{id}/dry-run:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Preview matching top-level files without submitting jobs
      security: [{ adminSession: [] }]
      responses:
        '200': { description: 'Current-file match preview only; scope is current_file_matches_only and truncated reports omitted entries. Stability, baseline, duplicates, permissions and concurrency are checked at execution.' }
  /api/v1/automations/{id}/run:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Run one bounded folder scan now
      security: [{ adminSession: [] }]
      responses:
        '202': { description: Scan accepted; resulting jobs use the existing durable job service }
  /api/v1/automations/{id}/history:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: List bounded execution history
      security: [{ adminSession: [] }]
      responses:
        '200': { description: File decisions, job states, outputs and sanitized errors }
components:
  securitySchemes:
    engineAdmin:
      type: http
      scheme: bearer
      description: Global ENGINE_ADMIN_TOKEN. Administrator access bypasses regular-user limits; keep server-side.
    userAPIKey:
      type: http
      scheme: bearer
      description: Per-user token beginning 101c_. Access is limited to the key's scopes, account permissions, and quotas.
    adminSession:
      type: apiKey
      in: cookie
      name: 101conv_admin
      description: Browser session. Each endpoint checks its required effective permission; administrator accounts have all permissions.
  parameters:
    JobId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CapabilityCatalog:
      type: object
      required: [schemaVersion, capabilities, providers]
      properties:
        schemaVersion: { type: integer, const: 1 }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/Provider' }
    Capability:
      type: object
      required: [id, operation, sourceFormat, targetFormat, providerIds]
      properties:
        id: { type: string, example: convert:png:jpg }
        operation: { type: string, enum: [convert, compress] }
        sourceFormat: { type: string }
        targetFormat: { type: string }
        providerIds: { type: array, items: { type: string } }
    Provider:
      type: object
      required: [id, profileId, version, name, engineId, enabled, installed, available, capabilities]
      properties:
        id: { type: string }
        profileId: { type: string, description: Legacy profile key retained for migration and preferences }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        license: { type: string }
        engineId: { type: string }
        engineVersion: { type: string }
        enabled: { type: boolean }
        installed: { type: boolean }
        available: { type: boolean }
        capabilities:
          type: array
          items:
            type: object
            required: [capabilityId]
            properties:
              capabilityId: { type: string }
              options:
                type: array
                items: { $ref: '#/components/schemas/CapabilityOption' }
    CapabilityOption:
      type: object
      required: [key, label, type, default]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [number, select, boolean] }
        default: { type: string }
        min: { type: number }
        max: { type: number }
        step: { type: number }
        choices: { type: array, items: { type: string } }
        targetSizeMb: { type: boolean }
    Preset:
      type: object
      required: [id, name, mode, sourceFormat, targetFormat, shared, default, compatible, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        mode: { type: string, enum: [convert, compress] }
        sourceFormat: { type: string, pattern: '^[a-z0-9]{1,12}$' }
        targetFormat: { type: string, pattern: '^[a-z0-9]{1,12}$' }
        providerId: { type: string }
        profileId: { type: string, description: Legacy profile key retained for migration }
        profileVersion: { type: string }
        options: { type: object, additionalProperties: { type: string }, maxProperties: 32 }
        shared: { type: boolean }
        default: { type: boolean }
        compatible: { type: boolean }
        compatibilityMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PresetWrite:
      type: object
      required: [name, mode, sourceFormat, targetFormat]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        mode: { type: string, enum: [convert, compress] }
        sourceFormat: { type: string, pattern: '^[a-z0-9.]{1,13}$' }
        targetFormat: { type: string, pattern: '^[a-z0-9.]{1,13}$' }
        providerId: { type: string, maxLength: 200 }
        profileId: { type: string, maxLength: 120 }
        profileVersion: { type: string, maxLength: 40 }
        options: { type: object, additionalProperties: { type: string }, maxProperties: 32 }
        shared: { type: boolean, default: false, description: Administrator only }
        default: { type: boolean, default: false }
    MountedDrive:
      type: object
      required: [id, name, path, access, enabled, accessible, writable, automationCount]
      properties:
        id: { type: string, description: Stable registration identifier }
        name: { type: string }
        path: { type: string, description: Container path beneath AUTOMATION_MOUNT_ROOTS }
        access: { type: string, enum: [read, read_write] }
        enabled: { type: boolean }
        accessible: { type: boolean }
        writable: { type: boolean }
        freeBytes: { type: integer, minimum: 0 }
        healthError: { type: string }
        automationCount: { type: integer, minimum: 0 }
    AutomationWrite:
      type: object
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        definition: { $ref: '#/components/schemas/AutomationDefinition' }
    BlueprintInstall:
      type: object
      required: [name, inputDriveId, outputDriveId, profileId, targetFormat]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        inputDriveId: { type: string }
        outputDriveId: { type: string }
        profileId: { type: string }
        profileVersion: { type: string, description: Omission resolves and persists the exact installed profile version }
        targetFormat: { type: string, pattern: '^[a-z0-9]{1,12}$' }
        options: { type: object, additionalProperties: { type: string }, maxProperties: 32 }
        condition: { $ref: '#/components/schemas/AutomationCondition' }
        extensions: { type: array, items: { type: string } }
        nameGlob: { type: string }
        minBytes: { type: integer, minimum: 0 }
        maxBytes: { type: integer, minimum: 0 }
        processExistingOnNextScan: { type: boolean, default: false, description: One-time request per saved revision to observe existing files on the next inventory traversal; prior submissions remain deduplicated }
        outputBehavior: { type: string, enum: [create, skip_existing, unique], default: unique }
        intervalSeconds: { type: integer, minimum: 30, maximum: 86400, default: 60 }
        stabilitySeconds: { type: integer, minimum: 5, maximum: 3600, default: 30 }
        maxConcurrent: { type: integer, minimum: 1, maximum: 8, default: 1 }
    AutomationDefinition:
      type: object
      required: [trigger, filter, action]
      properties:
        trigger:
          type: object
          required: [type, inputDriveId, stabilitySeconds]
          properties:
            type: { type: string, enum: [folder.scan, manual] }
            inputDriveId: { type: string }
            intervalSeconds: { type: integer, minimum: 30, maximum: 86400 }
            stabilitySeconds: { type: integer, minimum: 5, maximum: 3600 }
            maxConcurrent: { type: integer, minimum: 1, maximum: 8, default: 1 }
            processExistingOnNextScan: { type: boolean, default: false, description: One-time request per saved revision to observe existing files on the next inventory traversal; prior submissions remain deduplicated }
        filter:
          type: object
          properties:
            extensions: { type: array, items: { type: string } }
            nameGlob: { type: string }
            minBytes: { type: integer, minimum: 0 }
            maxBytes: { type: integer, minimum: 0 }
        condition: { $ref: '#/components/schemas/AutomationCondition' }
        action:
          type: object
          required: [mode, profileId, targetFormat, outputDriveId, outputBehavior]
          properties:
            mode: { type: string, enum: [convert, compress] }
            profileId: { type: string }
            profileVersion: { type: string, description: Exact profile version captured by this revision; omission on save resolves and persists the installed version }
            targetFormat: { type: string }
            options: { type: object, additionalProperties: { type: string }, maxProperties: 32 }
            outputDriveId: { type: string }
            outputBehavior: { type: string, enum: [create, skip_existing, unique] }
    AutomationCondition:
      type: object
      description: Declarative condition tree; arbitrary executable expressions are not supported.
      properties:
        operator: { type: string, enum: [and, or, not, extension, name_glob, min_size, max_size] }
        value: { type: string }
        bytes: { type: integer, minimum: 0 }
        children: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/AutomationCondition' } }
    Automation:
      type: object
      required: [id, ownerId, name, enabled, status, revision, definition, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        status: { type: string, enum: [ready, running, paused, blocked] }
        diagnostic: { type: string }
        revision: { type: integer, minimum: 1 }
        definition: { $ref: '#/components/schemas/AutomationDefinition' }
        lastExecution: { type: string, format: date-time }
        lastScan: { type: string, format: date-time }
    BlockDefinition:
      type: object
      required: [id, version, kind, name, description, configSchema, requiredPermission]
      properties:
        id: { type: string }
        version: { type: string }
        kind: { type: string, enum: [trigger, condition, action] }
        name: { type: string }
        description: { type: string }
        configSchema: { type: object, additionalProperties: true }
        requiredPermission: { type: string }
    ExtensionManifest:
      type: object
      description: Declarative compatibility metadata only; C.1 does not load or execute extension packages.
      required: [id, name, publisher, version, extensionApiRange]
      properties:
        id: { type: string }
        name: { type: string }
        publisher: { type: string }
        version: { type: string }
        extensionApiRange:
          type: object
          properties:
            minimum: { type: string }
            maximumExclusive: { type: string }
        externalApplication: { type: string }
        externalVersion: { type: string }
        permissions: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        dependencies: { type: object, additionalProperties: { type: string } }
        integrity: { type: string }
        configurationSchema: { type: integer, minimum: 1 }
    QuotaSettings:
      type: object
      required: [maxFileBytes, monthlyJobs, monthlyBytes]
      description: Each quota is independent; group settings may inherit, while a user may inherit or override each value.
      properties:
        maxFileBytes: { $ref: '#/components/schemas/QuotaLimit' }
        monthlyJobs: { $ref: '#/components/schemas/QuotaLimit' }
        monthlyBytes: { $ref: '#/components/schemas/QuotaLimit' }
    QuotaLimit:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [limited, unlimited, inherit] }
        value: { type: integer, minimum: 1, description: Required only when mode is limited; bytes for file/data quotas and jobs for job count. }
    Upload:
      type: object
      required: [id, fileName, extension, size, sha256, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        extension: { type: string }
        size: { type: integer, minimum: 1, maximum: 1073741824 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { type: string, format: date-time }
    JobSubmission:
      type: object
      required: [job, duplicate]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        duplicate: { type: boolean }
    Job:
      type: object
      required: [id, profileId, profileVersion, sourceFormat, targetFormat, mode, state, progress, attempt, maxAttempts, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string }
        profileVersion: { type: string }
        sourceFormat: { type: string }
        targetFormat: { type: string }
        mode: { type: string, enum: [convert, compress] }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { type: string }
        outputSize: { type: integer }
        originalState: { type: string, enum: [available, scheduled, expired, missing] }
        resultState: { type: string, enum: [not_ready, available, scheduled, expired, missing] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BatchRequest:
      type: object
      required: [mode, idempotencyKey, items]
      properties:
        mode: { type: string, enum: [convert, compress] }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/BatchItemRequest' }
    BatchItemRequest:
      type: object
      required: [uploadId, targetFormat]
      properties:
        uploadId: { type: string, format: uuid }
        profileId: { type: string }
        targetFormat: { type: string, pattern: '^[a-z0-9]{1,12}$' }
        options: { type: object, additionalProperties: { type: string }, description: Typed profile options are validated against the selected rule and frozen into the execution specification. }
    Batch:
      type: object
      required: [id, mode, state, total, queued, running, succeeded, failed, cancelled, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [convert, compress] }
        state: { type: string, enum: [queued, running, succeeded, partial, failed, cancelled] }
        total: { type: integer }
        queued: { type: integer }
        running: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/BatchItem' } }
    BatchItem:
      type: object
      required: [index, uploadId, state]
      properties:
        index: { type: integer, minimum: 0 }
        uploadId: { type: string, format: uuid }
        fileName: { type: string, description: Original uploaded filename for this batch owner. }
        jobId: { type: string, format: uuid }
        state: { type: string, enum: [pending, submitting, queued, running, succeeded, failed, cancelled] }
        error: { type: string }
        errorCode: { type: string, description: Stable category for failures detected before a job could be queued. }
        job: { $ref: '#/components/schemas/Job' }
        attempts:
          type: array
          description: Sanitized per-job execution history; raw stdout/stderr remain available only through the existing authorized job-detail API.
          items:
            type: object
            required: [number, state, startedAt]
            properties:
              number: { type: integer }
              state: { type: string }
              startedAt: { type: string, format: date-time }
              finishedAt: { type: string, format: date-time }
              error: { type: string }
    RetentionRule:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [keep, manual, after_days, after_success] }
        days: { type: integer, minimum: 1, maximum: 3650 }
    JobDetail:
      type: object
      required: [job, attempts]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        attempts:
          type: array
          items:
            type: object
