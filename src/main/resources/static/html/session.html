<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Details</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/html/template_609_crypto_vault/css/templatemo-crypto-style.css">
  <link rel="stylesheet" href="/html/template_609_crypto_vault/css/templatemo-crypto-pages.css">
  <link rel="stylesheet" href="/html/css/conv-crypto-overrides.css">
</head>
<body>
  <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
    <div class="hamburger"><span></span><span></span><span></span></div>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><div class="logo-icon">CV</div><span class="logo-text">101Conv</span></div>
      <nav class="nav-section">
        <div class="nav-label">Converter</div>
        <a href="/html/index.html" class="nav-item">Convert</a>
        <a href="/html/compress.html" class="nav-item">Compress</a>
        <a href="/html/history.html" class="nav-item active">History</a>
        <a href="/html/settings.html" class="nav-item">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <div class="theme-toggle">
          <div class="theme-toggle-label">Theme</div>
          <div class="theme-switch" id="themeSwitch"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Session Details</h1>
        <p>Inspect converted files, preview supported media, and download individual outputs.</p>
      </div>

      <section class="card stack-16">
        <div class="sort-controls" id="sortControls">
          <button class="sort-chip" type="button" data-sort="convertedFileName">Title</button>
          <button class="sort-chip" type="button" data-sort="sourceFileName">Original Name</button>
          <button class="sort-chip" type="button" data-sort="originalSizeBytes">Original Size</button>
          <button class="sort-chip" type="button" data-sort="convertedSizeBytes">Converted Size</button>
          <button class="sort-chip" type="button" data-sort="targetFormat">Format</button>
          <button class="sort-chip" type="button" data-sort="convertedAt">Converted Time</button>
        </div>
        <div class="app-grid-2">
          <div>
            <label for="minSizeMb" class="form-label">Min converted size (MB)</label>
            <input id="minSizeMb" type="number" min="0" step="0.1" placeholder="e.g. 1">
          </div>
          <div>
            <label for="maxSizeMb" class="form-label">Max converted size (MB)</label>
            <input id="maxSizeMb" type="number" min="0" step="0.1" placeholder="e.g. 200">
          </div>
        </div>

        <p id="status" class="status-line"></p>
        <p class="status-line">Tip: click sort chips to reorder results.</p>
        <p id="sessionInfo"></p>
        <div id="entriesRoot" class="entries-grid"></div>
      </section>

      <footer class="copyright">Converter UI based on TemplateMo 609 Crypto Vault</footer>
    </main>
  </div>

  <script src="/html/js/user.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const sessionInfoEl = document.getElementById("sessionInfo");
    const entriesRoot = document.getElementById("entriesRoot");
    const sortControlsEl = document.getElementById("sortControls");
    const minSizeMbEl = document.getElementById("minSizeMb");
    const maxSizeMbEl = document.getElementById("maxSizeMb");
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("sessionId") || "";
    const userId = params.get("userId") || convUser.getUserId();
    const dateTimeFormatter = new Intl.DateTimeFormat("de-DE", {
      year: "numeric",
      month: "short",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });
    let lastEntries = [];
    let currentSortBy = "convertedAt";
    let currentSortDir = "desc";

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
      statusEl.classList.toggle("ok", !isError);
    }

    function previewElement(entry) {
      const target = (entry.targetFormat || "").toLowerCase();
      const box = document.createElement("div");
      box.className = "preview-box";

      if (!entry.available) {
        box.textContent = "Preview unavailable (file missing).";
        return box;
      }

      if (["jpeg", "png", "webp", "gif", "bmp", "tiff", "jxl"].includes(target)) {
        const img = document.createElement("img");
        img.src = entry.previewUrl;
        img.alt = entry.convertedFileName || "preview";
        box.appendChild(img);
        return box;
      }

      if (["mp4", "mkv", "mov", "webm", "avi"].includes(target)) {
        const video = document.createElement("video");
        video.controls = true;
        video.src = entry.previewUrl;
        box.appendChild(video);
        return box;
      }

      if (["mp3", "wav", "flac", "ogg", "aac", "m4a"].includes(target)) {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.src = entry.previewUrl;
        box.appendChild(audio);
        return box;
      }

      box.textContent = "No inline preview for this format.";
      return box;
    }

    function formatDateTime(raw) {
      if (!raw) {
        return "";
      }
      const parsed = new Date(raw);
      if (Number.isNaN(parsed.getTime())) {
        return raw;
      }
      return dateTimeFormatter.format(parsed);
    }

    function formatBytes(bytes) {
      const value = Number(bytes || 0);
      if (!Number.isFinite(value) || value <= 0) {
        return "0 B";
      }
      const units = ["B", "KB", "MB", "GB", "TB"];
      let n = value;
      let idx = 0;
      while (n >= 1024 && idx < units.length - 1) {
        n /= 1024;
        idx += 1;
      }
      return `${n.toFixed(idx === 0 ? 0 : 1)} ${units[idx]}`;
    }

    function parseOptionalMb(rawValue) {
      const text = String(rawValue ?? "").trim();
      if (text === "") {
        return null;
      }
      const parsed = Number(text);
      if (!Number.isFinite(parsed) || parsed < 0) {
        return null;
      }
      return parsed;
    }

    function passesSizeFilter(entry) {
      const convertedBytes = Number(entry.convertedSizeBytes || 0);
      const minMb = parseOptionalMb(minSizeMbEl.value);
      const maxMb = parseOptionalMb(maxSizeMbEl.value);
      if (minMb !== null && convertedBytes < (minMb * 1024 * 1024)) {
        return false;
      }
      if (maxMb !== null && convertedBytes > (maxMb * 1024 * 1024)) {
        return false;
      }
      return true;
    }

    function updateSortChips() {
      sortControlsEl.querySelectorAll("[data-sort]").forEach((button) => {
        const key = button.getAttribute("data-sort");
        const baseLabel = button.getAttribute("data-label") || button.textContent.replace(/[↑↓]\s*$/, "").trim();
        button.setAttribute("data-label", baseLabel);
        if (key === currentSortBy) {
          button.classList.add("active");
          button.textContent = `${baseLabel}${currentSortDir === "asc" ? " ↑" : " ↓"}`;
        } else {
          button.classList.remove("active");
          button.textContent = baseLabel;
        }
      });
    }

    function toggleSort(sortBy) {
      if (currentSortBy === sortBy) {
        currentSortDir = currentSortDir === "asc" ? "desc" : "asc";
      } else {
        currentSortBy = sortBy;
        currentSortDir = "desc";
      }
      updateSortChips();
      render(lastEntries);
    }

    function sortedEntries(entries) {
      const sortBy = currentSortBy;
      const direction = currentSortDir === "asc" ? 1 : -1;
      const sorted = [...entries].filter(passesSizeFilter);
      sorted.sort((a, b) => {
        let av;
        let bv;
        if (sortBy === "convertedAt") {
          av = a.convertedAt ? new Date(a.convertedAt).getTime() : 0;
          bv = b.convertedAt ? new Date(b.convertedAt).getTime() : 0;
        } else if (sortBy === "originalSizeBytes" || sortBy === "convertedSizeBytes") {
          av = Number(a[sortBy] || 0);
          bv = Number(b[sortBy] || 0);
        } else {
          av = String(a[sortBy] || "");
          bv = String(b[sortBy] || "");
        }
        if (av < bv) return -1 * direction;
        if (av > bv) return 1 * direction;
        return 0;
      });
      return sorted;
    }

    function render(entries) {
      entriesRoot.innerHTML = "";
      if (entries.length === 0) {
        entriesRoot.textContent = "No converted files found for this session.";
        return;
      }

      for (const entry of sortedEntries(entries)) {
        const card = document.createElement("div");
        card.className = "detail-card";

        const available = entry.available ? "available" : "missing";
        const originalSizeText = formatBytes(entry.originalSizeBytes);
        const convertedSizeText = formatBytes(entry.convertedSizeBytes);
        card.innerHTML = `
          <b>${entry.convertedFileName || "converted file"}</b>
          <div class="entry-meta">
            Source: ${entry.sourceFileName || ""} (.${entry.sourceFormat || ""})<br>
            Converted to: <b>.${entry.targetFormat || ""}</b><br>
            Size: ${originalSizeText} -> ${convertedSizeText}<br>
            Converted: ${formatDateTime(entry.convertedAt)}<br>
            Status: ${available}
          </div>
        `;

        const actions = document.createElement("div");
        actions.className = "entry-actions";
        if (entry.available) {
          const download = document.createElement("a");
          download.href = entry.downloadUrl;
          download.className = "icon-btn";
          download.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 3v12"></path>
              <path d="M7 10l5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
            <span>Download</span>`;
          actions.appendChild(download);

          const saveAs = document.createElement("button");
          saveAs.type = "button";
          saveAs.className = "icon-btn";
          saveAs.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <path d="M17 21v-8H7v8"></path>
              <path d="M7 3v5h8"></path>
            </svg>
            <span>Save As</span>`;
          saveAs.addEventListener("click", () => {
            void saveAsFromUrl(entry.downloadUrl, entry.convertedFileName || "converted-file");
          });
          actions.appendChild(saveAs);
        }
        const del = document.createElement("button");
        del.type = "button";
        del.className = "icon-btn danger";
        del.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
          <span>Delete</span>`;
        del.addEventListener("click", () => {
          void deleteEntry(entry.uploadId);
        });
        actions.appendChild(del);
        card.appendChild(actions);
        card.appendChild(previewElement(entry));
        entriesRoot.appendChild(card);
      }
    }

    async function deleteEntry(uploadId) {
      const confirmed = window.confirm("Delete this converted file from history?");
      if (!confirmed) {
        return;
      }

      const data = new URLSearchParams();
      data.append("userId", userId);
      data.append("sessionId", sessionId);
      data.append("uploadId", uploadId);

      try {
        const res = await fetch("/api/history/session/entry/delete", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: data.toString()
        });
        if (!res.ok) {
          setStatus("Could not delete entry.", true);
          return;
        }
        lastEntries = lastEntries.filter(entry => entry.uploadId !== uploadId);
        render(lastEntries);
        setStatus("Entry deleted.");
      } catch (e) {
        setStatus(`Delete failed: ${e.message}`, true);
      }
    }

    async function saveAsFromUrl(url, fallbackName) {
      if (!url) {
        return;
      }

      if (!window.showSaveFilePicker) {
        window.location.href = url;
        return;
      }

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Download failed (${response.status})`);
        }
        const blob = await response.blob();
        let suggestedName = fallbackName || "converted-file";
        const contentDisposition = response.headers.get("Content-Disposition") || "";
        const match = contentDisposition.match(/filename=\"?([^\";]+)\"?/i);
        if (match && match[1]) {
          suggestedName = match[1];
        }

        const handle = await window.showSaveFilePicker({ suggestedName });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
      } catch (e) {
        setStatus(`Save As failed: ${e.message}`, true);
      }
    }

    async function loadSessionDetails() {
      if (!sessionId) {
        setStatus("Missing sessionId in URL.", true);
        return;
      }

      sessionInfoEl.innerHTML = `Session archive | <a href="/api/history/session/download?sessionId=${encodeURIComponent(sessionId)}&userId=${encodeURIComponent(userId)}">Download</a>`;
      setStatus("Loading session entries...");
      try {
        const res = await fetch(`/api/history/session?sessionId=${encodeURIComponent(sessionId)}&userId=${encodeURIComponent(userId)}`);
        const payload = await res.json();
        if (!res.ok || !payload.ok) {
          setStatus(payload.message || "Could not load session entries.", true);
          return;
        }
        lastEntries = payload.entries || [];
        render(lastEntries);
        setStatus(`Loaded ${payload.count || 0} entries.`);
      } catch (e) {
        setStatus(`Could not load session entries: ${e.message}`, true);
      }
    }

    sortControlsEl.querySelectorAll("[data-sort]").forEach((button) => {
      button.addEventListener("click", () => {
        toggleSort(button.getAttribute("data-sort"));
      });
    });

    minSizeMbEl.addEventListener("input", () => {
      render(lastEntries);
    });

    maxSizeMbEl.addEventListener("input", () => {
      render(lastEntries);
    });

    updateSortChips();
    void loadSessionDetails();
  </script>
  <script src="/html/template_609_crypto_vault/js/templatemo-crypto-script.js"></script>
</body>
</html>
