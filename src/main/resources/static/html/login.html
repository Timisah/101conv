<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | 101Conv</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/html/template_609_crypto_vault/css/templatemo-crypto-style.css">
  <link rel="stylesheet" href="/html/css/conv-crypto-overrides.css">
</head>
<body>
  <main class="main-content" style="max-width: 520px; margin: 0 auto; padding-top: 56px;">
    <section class="card stack-16">
      <div class="page-header">
        <h1>Welcome to 101Conv</h1>
        <p>Login or create an account to keep your own conversion sessions.</p>
        <p class="status-line">The first account created becomes admin automatically.</p>
      </div>

      <div class="sort-controls" id="authModeControls">
        <button class="sort-chip active" type="button" data-mode="login">Login</button>
        <button class="sort-chip" type="button" data-mode="register">Register</button>
      </div>

      <p id="status" class="status-line"></p>

      <div class="stack-16">
        <div>
          <label for="username" class="form-label">Username</label>
          <input id="username" type="text" autocomplete="username" placeholder="e.g. Big Boss">
        </div>
        <div>
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters">
        </div>
      </div>

      <div class="app-controls">
        <button id="submitButton" class="action-btn primary" type="button">Login</button>
        <button id="resetTempButton" class="action-btn" type="button">Reset Password (Temp)</button>
      </div>
    </section>
  </main>

  <script>
    const authModeControls = document.getElementById("authModeControls");
    const statusEl = document.getElementById("status");
    const usernameEl = document.getElementById("username");
    const passwordEl = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const resetTempButton = document.getElementById("resetTempButton");

    let mode = "login";

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
      statusEl.classList.toggle("ok", !isError);
    }

    function updateMode(nextMode) {
      mode = nextMode;
      authModeControls.querySelectorAll("[data-mode]").forEach((button) => {
        button.classList.toggle("active", button.getAttribute("data-mode") === mode);
      });
      submitButton.textContent = mode === "register" ? "Create Account" : "Login";
      setStatus("");
    }

    async function submit() {
      const username = String(usernameEl.value || "").trim();
      const password = String(passwordEl.value || "");

      if (!username || !password) {
        setStatus("Username and password are required.", true);
        return;
      }

      const endpoint = mode === "register" ? "/api/auth/register" : "/api/auth/login";
      const data = new URLSearchParams();
      data.append("username", username);
      data.append("password", password);

      setStatus(mode === "register" ? "Creating account..." : "Logging in...");
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: data.toString()
        });
        const payload = await res.json();
        if (!res.ok || !payload.ok) {
          setStatus(payload.message || "Authentication failed.", true);
          return;
        }

        try {
          localStorage.setItem("conv_user_id", String(payload.userId || username).toLowerCase());
        } catch (e) {
          // ignore local storage failures
        }

        const params = new URLSearchParams(window.location.search);
        const next = params.get("next") || "/";
        window.location.href = next;
      } catch (e) {
        setStatus(`Authentication failed: ${e.message}`, true);
      }
    }

    async function resetTemporaryPassword() {
      const username = String(usernameEl.value || "").trim();
      if (!username) {
        setStatus("Enter your username first.", true);
        return;
      }

      const data = new URLSearchParams();
      data.append("username", username);

      setStatus("Generating temporary password...");
      try {
        const res = await fetch("/api/auth/reset-temp", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: data.toString()
        });
        const payload = await res.json();
        if (!res.ok || !payload.ok) {
          setStatus(payload.message || "Could not reset password.", true);
          return;
        }
        setStatus("Temporary password created. Check server terminal output.", false);
      } catch (e) {
        setStatus(`Could not reset password: ${e.message}`, true);
      }
    }

    authModeControls.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        updateMode(button.getAttribute("data-mode"));
      });
    });

    submitButton.addEventListener("click", () => {
      void submit();
    });

    resetTempButton.addEventListener("click", () => {
      void resetTemporaryPassword();
    });

    passwordEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        void submit();
      }
    });

    void (async function checkAlreadyLoggedIn() {
      try {
        const res = await fetch("/api/auth/me");
        if (!res.ok) {
          return;
        }
        const payload = await res.json();
        if (payload && payload.ok && payload.authenticated) {
          const params = new URLSearchParams(window.location.search);
          const next = params.get("next") || "/";
          window.location.href = next;
        }
      } catch (e) {
        // ignore
      }
    })();
  </script>
</body>
</html>
